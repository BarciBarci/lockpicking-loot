<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Too Many Bones — Lockpicking logic tests</title>
  <style>
    body {
      margin: 0;
      padding: 28px 18px 60px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #0e1116;
      color: #e8edf3;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.2rem; letter-spacing: 0.5px; }
    #summary { margin: 12px 0 18px; font-weight: 700; }
    #summary.pass { color: #5fbf7a; }
    #summary.fail { color: #d9634f; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    li { padding: 8px 12px; border-radius: 8px; background: #1b2027; border: 1px solid #2f3945; }
    li.pass::before { content: '✔ '; color: #5fbf7a; }
    li.fail { border-color: #d9634f; }
    li.fail::before { content: '✘ '; color: #d9634f; }
    li .msg { display: block; margin-top: 4px; color: #f0a99c; }
    #app { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Too Many Bones — Lockpicking logic tests</h1>
    <div id="summary">Running…</div>
    <ul id="results"></ul>
  </div>

  <!-- app.js needs an #app node to boot; it's hidden and rendering is stubbed. -->
  <div id="app"></div>
  <script src="app.js"></script>
  <script src="tests.js"></script>
</body>
</html>
